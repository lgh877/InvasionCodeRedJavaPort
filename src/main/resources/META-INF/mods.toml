# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="[47,)" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
license="All Rights Reserved"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
modId="invasioncodered" #mandatory
version="1.0.0" #mandatory
displayName="InvasionCodeRed" #mandatory
authors="Xnd, Sweegy, Tamir, CrimsonSteve"
description='''InvasionCodeRed was an addon from bedrock originally. And now it has come to java too.'''

# A dependency - use the . to indicate dependency for a specific modid.
[[dependencies.invasioncodered]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.invasioncodered]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="AFTER"
    side="BOTH"